<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="336" viewBox="0 0 440 336" role="img" aria-label="How do you stop a car being overbooked? It fails: Each request for seats looks fine on its own, so a car can end up with more riders than seats. It catches: At the moment a driver accepts, it counts the seats taken across the whole car, not per group. Limit: Two accepts at the same moment can both pass."><title>How do you stop a car being overbooked? It fails: Each request for seats looks fine on its own, so a car can end up with more riders than seats. It catches: At the moment a driver accepts, it counts the seats taken across the whole car, not per group. Limit: Two accepts at the same moment can both pass.</title><style><![CDATA[@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Newsreader';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}]]></style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.9" fill="#ece9e1" fill-opacity="0.07"/></pattern></defs><rect x="6" y="6" width="428" height="324" rx="16" fill="#131416" stroke="#2e3033" stroke-width="1.5"/><rect x="6" y="6" width="428" height="324" rx="16" fill="url(#dots)"/><rect x="7" y="7" width="426" height="322" rx="15" fill="#222838" fill-opacity="0.78"/><polygon points="359.8,57.8 362.1,59.7 362.1,50.6 359.8,48.7" fill="#202226"/><polygon points="362.1,59.7 372.5,56.7 372.5,47.6 362.1,50.6" fill="#2a2c31"/><polygon points="359.8,48.7 370.2,45.7 372.5,47.6 362.1,50.6" fill="#3b3e44"/><polygon points="376.3,72.1 378.6,74.0 378.6,64.9 376.3,63.0" fill="#202226"/><polygon points="378.6,74.0 389.0,71.0 389.0,61.9 378.6,64.9" fill="#2a2c31"/><polygon points="376.3,63.0 386.7,60.0 389.0,61.9 378.6,64.9" fill="#3b3e44