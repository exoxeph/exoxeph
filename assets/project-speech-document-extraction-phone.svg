<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="336" viewBox="0 0 440 336" role="img" aria-label="What if a reading looks valid but is not? It fails: Reading a photographed lab report can misread a value, and a misread can still look like a good number. It catches: Only value shapes it knows are accepted; a row that does not match is left out, not guessed. Limit: &lt;8.5 read in place of &lt;0.5 looks valid, so it is kept."><title>What if a reading looks valid but is not? It fails: Reading a photographed lab report can misread a value, and a misread can still look like a good number. It catches: Only value shapes it knows are accepted; a row that does not match is left out, not guessed. Limit: &lt;8.5 read in place of &lt;0.5 looks valid, so it is kept.</title><style><![CDATA[@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Newsreader';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}]]></style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.9" fill="#ece9e1" fill-opacity="0.07"/></pattern></defs><rect x="6" y="6" width="428" height="324" rx="16" fill="#131416" stroke="#2e3033" stroke-width="1.5"/><rect x="6" y="6" width="428" height="324" rx="16" fill="url(#dots)"/><rect x="7" y="7" width="426" height="322" rx="15" fill="#273027" fill-opacity="0.78"/><polygon points="322.0,70.0 352.0,96.0 352.0,92.1 322.0,66.1" fill="#8f8c84"/><polygon points="352.0,96.0 393.6,84.0 393.6,80.1 352.0,92.1" fill="#bdb9af"/><polygon points="322.0,66.1 363.6,54.1 393.6,80.1 352.0,92.1" fill="#ece9e1"/><polyline points="332.4,69.0 351.9,63.4" stroke="#8f8c84" stroke-width="1.2" fill="none"/><polygon points="355.5,60.6 358.8,63.5 358.8,60.2 355.5,57.3" fill="#7acf9f"/><polygon points