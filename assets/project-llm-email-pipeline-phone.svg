<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="336" viewBox="0 0 440 336" role="img" aria-label="When should an AI not start writing? It fails: A single prompt writes a confident email even when the request is vague or missing facts. It catches: Ordinary code checks the request first, then a model judges whether there is enough to write from. Limit: For one unclear request it still wrote an email when it should have asked."><title>When should an AI not start writing? It fails: A single prompt writes a confident email even when the request is vague or missing facts. It catches: Ordinary code checks the request first, then a model judges whether there is enough to write from. Limit: For one unclear request it still wrote an email when it should have asked.</title><style><![CDATA[@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Newsreader';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}]]></style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.9" fill="#ece9e1" fill-opacity="0.07"/></pattern></defs><rect x="6" y="6" width="428" height="324" rx="16" fill="#131416" stroke="#2e3033" stroke-width="1.5"/><rect x="6" y="6" width="428" height="324" rx="16" fill="url(#dots)"/><rect x="7" y="7" width="426" height="322" rx="15" fill="#1f3030" fill-opacity="0.78"/><polygon points="322.0,70.0 343.0,88.2 343.0,83.6 322.0,65.5" fill="#8f8c84"/><polygon points="343.0,88.2 395.0,73.2 395.0,68.6 343.0,83.6" fill="#bdb9af"/><polygon points="322.0,65.5 374.0,50.5 395.0,68.6 343.0,83.6" fill="#ece9e1"/><polyline points="322.0,65.3 359.2,67.6 374.0,50.3" fill="none" stroke="#8f8c84" stroke-width="1.2"/><polygon points="357.0,71.8 360.8,75.0 360.8,73.1 357.0,69.8" fill="#9c4f27"/><polygon points="360.8,75.0 371.2,72.0 371.2,70.1 360.8,73.1" fill="#d9793a"/><polygon points="357.0,69.8 367.4,66.8 371.2,70.1 360.8,73.1" fill="#ffc867"/><text x="30" y="52" font-family="IBM Plex Mono" font-weight="500" font-size="17" fill="#9ca9ff" text-anchor="start" letter-spacing="2" >02 / 04</text><text x="30" y="82" font-family="IBM Plex Mono" font-weight="500" font-size="16" fill="#a5a49e" text-anchor="start" letter-spacing="1.9" >LLM PIPELINE</text><text x="30" y="154" font-family="Newsreader" font-weight="400" font-size="37" fill="#ece9e1" text-anchor="start" >When should an AI not</text><text x="30" y="196.9" font-family="Newsreader" font-weight="400" font-size="37" fill="#ece9e1" text-anchor="start" >start writing?</text><rect x="30" y="264" width="72" height="34" rx="6" fill="#9ca9ff" fill-opacity="0.12" stroke="#9ca9ff" stroke-opacity="0.45"/><text x="39" y="286.2" font-family="IBM Plex Mono" font-weight="400" font-size="15" fill="#ece9e1" text-anchor="start" >Python</text><rect x="112" y="264" width="99" height="34" rx="6" fill="#9ca9ff" fill-opacity="0.12" stroke="#9ca9ff" stroke-opacity="0.45"/><text x="121" y="286.2" font-family="IBM Plex Mono" font-weight="400" font-size="15" fill="#ece9e1" text-anchor="start" >Streamlit</text></svg>