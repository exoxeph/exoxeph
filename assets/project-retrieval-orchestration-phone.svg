<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="336" viewBox="0 0 440 336" role="img" aria-label="When should an AI trust its first answer? It fails: A first draft can be too short, drift off the question or stop mid-thought, and nothing says so. It catches: Each draft is scored with simple quality rules; below the required quality, one more attempt with tighter settings. Limit: Repair is an attempt, not a guarantee; both repaired answers stayed below the requirement."><title>When should an AI trust its first answer? It fails: A first draft can be too short, drift off the question or stop mid-thought, and nothing says so. It catches: Each draft is scored with simple quality rules; below the required quality, one more attempt with tighter settings. Limit: Repair is an attempt, not a guarantee; both repaired answers stayed below the requirement.</title><style><![CDATA[@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Newsreader';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}]]></style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.9" fill="#ece9e1" fill-opacity="0.07"/></pattern></defs><rect x="6" y="6" width="428" height="324" rx="16" fill="#131416" stroke="#2e3033" stroke-width="1.5"/><rect x="6" y="6" width="428" height="324" rx="16" fill="url(#dots)"/><rect x="7" y="7" width="426" height="322" rx="15" fill="#302530" fill-opacity="0.78"/><polygon points="327.4,70.2 354.4,93.6 354.4,89.7 327.4,66.3" fill="#8f8c84"/><polygon points="354.4,93.6 393.4,82.3 393.4,78.4 354.4,89.7" fill="#bdb9af"/><polygon points="327.4,66.3 366.4,55.0 393.4,78.4 354.4,89.7" fill="#ece9e1"/><polygon points="324.7,64.2 351.7,87.6 351.7,83.7 324.7,60.3" fill="#8f8c84"/><polygon poin