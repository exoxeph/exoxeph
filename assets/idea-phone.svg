<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="440" height="400" viewBox="0 0 440 400" role="img" aria-label="What I build: check before acting. A request comes in, a check sits in its path, and the system acts only if the check passes. Four systems below."><title>What I build: check before acting. A request comes in, a check sits in its path, and the system acts only if the check passes. Four systems below.</title><style><![CDATA[@font-face{font-family:'IBM Plex Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Comic Neue';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Newsreader';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}]]></style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="0.9" fill="#ece9e1" fill-opacity="0.07"/></pattern></defs><rect x="6" y="6" width="428" height="388" rx="16" fill="#131416" stroke="#2e3033" stroke-width="1.5"/><rect x="6" y="6" width="428" height="388" rx="16" fill="url(#dots)"/><text x="28" y="46" font-family="IBM Plex Mono" font-weight="500" font-size="11.5" fill="#9ca9ff" text-anchor="start" letter-spacing="1.4" >WHAT I BUILD</text><text x="28" y="90" font-family="Newsreader" font-weight="400" font-size="34" fill="#ece9e1" text-anchor="start" >Check before acting.</text><text x="28" y="124" font-family="Newsreader" font-weight="400" font-size="17" fill="#a5a49e" text-anchor="start" >Four systems. Each one breaks somewhere. Here's</text><text x="28" y="147.8" font-family="Newsreader" font-weight="400" font-size="17" fill="#a5a49e" text-anchor="start" >where, and what catches it.</text><g transform="translate(24 196) scale(0.89)"><rect x="0" y="50" width="100" height="40" rx="7" fill="#0f1012" stroke="#a5a49e" stroke-width="1" /><text x="50" y="75" font-family="IBM Plex Mono" font-weight="400" font-size="13" fill="#ece9e1" text-anchor="middle" >a request</text><line x1="100" y1="70" x2="140" y2="70" stroke="#a5a49e" stroke-width="1" /><polygon points="168,42 196,70 168,98 140,70" fill="#0f1012" stroke="#9ca9ff" stroke-width="1.4"/><circle cx="168" cy="70" r="5" fill="#9ca9ff"/><text x="168" y="118" font-family="IBM Plex Mono" font-weight="500" font-size="12" fill="#9ca9ff" text-anchor="middle" letter-spacing="1" >CHECK</text><line x1="196" y1="70" x2="210" y2="70" stroke="#a5a49e" stroke-width="1" /><path d="M210 70 V20 H258" fill="none" stroke="#7acf9f" stroke-width="1.4"/><path d="M210 70 V120 H258" fill="none" stroke="#f28d7b" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="258" y="0" width="172" height="40" rx="7" fill="#0f1012" stroke="#7acf9f" stroke-width="1.2" /><text x="344" y="25" font-family="IBM Plex Mono" font-weight="400" font-size="13" fill="#ece9e1" text-anchor="middle" >the system acts</text><text x="216" y="13" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#7acf9f" text-anchor="start" >PASS</text><rect x="258" y="100" width="172" height="40" rx="7" fill="#0f1012" stroke="#f28d7b" stroke-width="1.2" stroke-dasharray="4 3"/><text x="344" y="125" font-family="IBM Plex Mono" font-weight="400" font-size="12" fill="#ece9e1" text-anchor="middle" >ask, refuse, leave out</text><text x="216" y="136" font-family="IBM Plex Mono" font-weight="500" font-size="11" fill="#f28d7b" text-anchor="start" >FAIL</text></g><text x="70" y="366" font-family="Comic Neue" font-weight="700" font-size="15" fill="#f4d58d" text-anchor="start" transform="rotate(-2 70 366)">the check sits in its path</text></svg>